<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo list - Register</title>
    <link rel="stylesheet" href="style.css">
    <script src="main.js"></script>
    
    
</head>
<body>
    <header>
        <nav class="topnav">
            <button id="mainBtn">Home</button>
            <button id="redirectToLogin">Log in</button>
            <button id="redirectToRegister">Register</button>
        </nav>
        <h1>Register</h1>
    </header>
    <input type="text" id="usernameInput" class="inputBox" name="Username" placeholder="Username">
    <input type="text" id="firstnameInput" class="inputBox" name="First name" placeholder="First name">
    <input type="text" id="surnameInput" class="inputBox" name="Last name" placeholder="Last name">
    <input type="text" id="passwordInput" class="inputBox" name="Password" placeholder="Password">
    <button id="registerSubmitButton">Submit</button>
    <div id="registrationConfirmMessage"></div>

    
</body>
</html>
